<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال · حجز طباعة الامتحانات</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f7f9; --fg: #1c1c1e; --muted: #6b7280; --primary: #007aff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #070707; --fg: #f2f2f7; --muted: #9ca3af; --primary: #0a84ff; } }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--fg); font-family: system-ui, "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 16px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      a { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; padding: 10px 24px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <main>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تحقق من الاتصال ثم أعد المحاولة.</p>
      <a href="/">إعادة المحاولة</a>
    </main>
  </body>
</html>
